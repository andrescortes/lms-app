openapi: 3.1.0
info:
  title: Identity Service API
  version: 1.0.0
  description: >-
    Contract for the Identity service. This version covers student registration
    (CU-AUTH-01 / HU-01) and user login (CU-AUTH-02 / HU-02). Canonical copy:
    shared/contracts/identity.openapi.yaml.
servers:
  - url: /
    description: Relative to the deployed Identity service base URL
tags:
  - name: Identity
    description: Registration and identity lifecycle operations
paths:
  /api/identity/auth/register:
    post:
      tags:
        - Identity
      operationId: registerUser
      summary: Register a new student account
      description: >-
        Creates a STUDENT account and an associated empty profile from an email
        and password. Surrounding whitespace is trimmed and the email lowercased
        before validation, uniqueness checking, and storage; the normalized email
        must be unique. The password must be 8 to 72 characters and contain at least
        one uppercase letter and one digit. The plaintext password is never returned
        or stored. A successful registration records one logical UserRegistered event
        for restart-safe delivery; downstream consumers tolerate rare duplicate
        deliveries of that event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            examples:
              withDisplayName:
                summary: Registration with an explicit display name
                value:
                  email: Student@Example.com
                  password: Learn123
                  displayName: Student One
              withoutDisplayName:
                summary: Registration without a display name (defaults to email local part)
                value:
                  email: student@example.com
                  password: Learn123
      responses:
        '201':
          description: Account created. The new user ID is returned.
          headers:
            Location:
              description: Canonical location of the created user resource.
              schema:
                type: string
                format: uri-reference
              example: /api/identity/users/9f1c7d3e-6b2a-4c88-9f0e-2a5b1c3d4e6f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
              example:
                userId: 9f1c7d3e-6b2a-4c88-9f0e-2a5b1c3d4e6f
        '400':
          description: The request body is malformed or contains unknown fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: invalid_request
                message: Request body is malformed or contains unknown fields
                timestamp: '2026-11-18T10:15:30.123Z'
                path: /api/identity/auth/register
        '409':
          description: >-
            The normalized email is already registered. No details about the
            existing account are disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: email_already_exists
                message: An account with this email already exists
                timestamp: '2026-11-18T10:15:30.123Z'
                path: /api/identity/auth/register
        '422':
          description: >-
            The request is well-formed but violates the email format or password
            policy. The message names the violated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  value:
                    code: validation_error
                    message: email must be a valid address
                    timestamp: '2026-11-18T10:15:30.123Z'
                    path: /api/identity/auth/register
                weakPassword:
                  value:
                    code: validation_error
                    message: password must contain at least one uppercase letter
                    timestamp: '2026-11-18T10:15:30.123Z'
                    path: /api/identity/auth/register
                passwordTooLong:
                  value:
                    code: validation_error
                    message: password must be at most 72 characters
                    timestamp: '2026-11-18T10:15:30.123Z'
                    path: /api/identity/auth/register
        '429':
          description: >-
            The visitor made a sixth registration attempt within 15 minutes (the
            first five are allowed) and is temporarily locked out for 30 minutes.
            The response does not reveal remaining lockout time and no Retry-After
            header is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: rate_limited
                message: Too many registration attempts; please try again later
                timestamp: '2026-11-18T10:15:30.123Z'
                path: /api/identity/auth/register
        '500':
          description: An unexpected error occurred. Details are logged server-side only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: internal_error
                message: An unexpected error occurred
                timestamp: '2026-11-18T10:15:30.123Z'
                path: /api/identity/auth/register
  /api/identity/auth/login:
    post:
      tags:
        - Identity
      operationId: loginUser
      summary: Sign in with email and password
      description: >-
        Normalizes the submitted email by trimming and lowercasing it, verifies
        the password against the stored protected hash, and returns an access
        token valid for 15m and a rotating refresh token valid for 7d persisted
        with a unique jti. Invalid credentials return a generic error that does
        not reveal whether the account exists. Attempts are limited to 10 per
        minute per visitor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: Student@Example.com
              password: Learn123
      responses:
        '200':
          description: >-
            Valid credentials. The access token is valid for 15m and carries the
            user id and role; the refresh token is valid for 7d and persisted
            with a unique jti.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9...
                refreshToken: 3f9a7c1e8b2d4a6f...
        '400':
          description: The request body is malformed or contains unknown fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >-
            The email or password is invalid. The code is always
            invalid_credentials and the response never reveals whether an account
            exists for the email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: invalid_credentials
                message: invalid credentials
                timestamp: '2026-11-18T10:15:30.123Z'
                path: /api/identity/auth/login
        '422':
          description: >-
            The email is not a well-formed address after normalization; the
            message names the violated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            The visitor exceeded the limit of 10 sign-in attempts per minute.
            The response does not reveal remaining attempts and no Retry-After
            header is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An unexpected error occurred. Details are logged server-side only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/identity/auth/refresh:
    post:
      tags:
        - Identity
      operationId: refreshSession
      summary: Exchange a refresh token for a new token pair
      description: >-
        Revokes the presented refresh token and returns a new access token and a
        new refresh token. A malformed, expired, unknown, or already-revoked token
        is refused with 401 INVALID_TOKEN. Presenting an already-revoked token
        also revokes every other active refresh token for that user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated. Access token lives 15m; refresh token lives 7d.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: The request body is malformed, carries unknown fields, or omits refreshToken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >-
            The refresh token is malformed, expired, never issued, or already
            revoked. The code is always INVALID_TOKEN and no tokens are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_TOKEN
                message: invalid token
                timestamp: '2026-11-20T10:15:30.123Z'
                path: /api/identity/auth/refresh
        '429':
          description: More than 10 refresh attempts in a minute from this client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/identity/auth/logout:
    post:
      tags:
        - Identity
      operationId: logoutUser
      security:
        - bearerAuth: []
      summary: End the session named by a refresh token
      description: >-
        Revokes the refresh token named in the body when it belongs to the caller
        identified by the bearer access token. A token that is missing, revoked,
        expired, or owned by another account is refused with 401 INVALID_TOKEN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: The caller's session ended. No body.
        '400':
          description: The body is malformed, carries unknown fields, or omits refreshToken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >-
            The bearer credential is missing, malformed, expired, or signed with an
            unexpected method, or the refresh token is not the caller's or is no
            longer active. The code is INVALID_TOKEN for the refresh case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_TOKEN
                message: invalid token
                timestamp: '2026-11-20T10:15:30.123Z'
                path: /api/identity/auth/logout
        '403':
          description: >-
            The caller is authenticated but their role is not allowed on this
            route. The code is FORBIDDEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/identity/users/me:
    get:
      tags:
        - Identity
      operationId: getMyProfile
      security:
        - bearerAuth: []
      summary: Read the caller's account and profile
      description: >-
        Returns the signed-in learner's account details and profile fields. Never
        returns the password. An unset profile field is reported as null.
      responses:
        '200':
          description: The caller's account and profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: The bearer credential is missing, malformed, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The authenticated account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: NOT_FOUND
                message: not found
                timestamp: '2026-11-20T10:15:30.123Z'
                path: /api/identity/users/me
    patch:
      tags:
        - Identity
      operationId: updateMyProfile
      security:
        - bearerAuth: []
      summary: Partially update the caller's account and profile
      description: >-
        Applies a partial update. A field absent from the body keeps its value; a
        profile field sent as null is cleared. A password change requires the
        current password and a new password meeting the policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated account and profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The body is malformed or carries unknown fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >-
            The bearer credential is invalid, or the password change proof is
            missing or wrong. The latter uses the code INVALID_CREDENTIALS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The authenticated account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            A present display name is blank, or a new password does not meet the
            policy. The weak-password case uses the code WEAK_PASSWORD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: WEAK_PASSWORD
                message: password must contain at least one uppercase letter
                timestamp: '2026-11-20T10:15:30.123Z'
                path: /api/identity/users/me
  /api/identity/users:
    get:
      tags:
        - Identity
      operationId: listUsers
      security:
        - bearerAuth: []
      summary: List accounts, newest first
      description: >-
        Returns one page of account summaries and the total count of accounts
        matching the filters. Requires an ADMIN caller. No password is ever
        returned.
      parameters:
        - name: role
          in: query
          description: Restrict to one role.
          schema:
            type: string
        - name: cefrLevel
          in: query
          description: Restrict to one stored learning level.
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive fragment matched against email or display name.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: One page of accounts with the filtered total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: A query parameter is not a number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The bearer credential is missing, malformed, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller is authenticated but is not an administrator. The code is FORBIDDEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: FORBIDDEN
                message: forbidden
                timestamp: '2026-11-20T10:15:30.123Z'
                path: /api/identity/users
        '422':
          description: A page, limit, role, or level value is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: >-
            Email address. Trimmed and lowercased before validation, uniqueness
            checking, and storage.
          maxLength: 320
          examples:
            - Student@Example.com
        password:
          type: string
          description: >-
            Plaintext password. 8 to 72 characters inclusive with at least one
            uppercase letter and one digit; longer values are rejected with the
            length rule named. Never echoed in any response or event.
          minLength: 8
          maxLength: 72
          format: password
        displayName:
          type: string
          description: >-
            Optional display name. When omitted or blank, defaults to the local
            part of the normalized email.
          maxLength: 200
          examples:
            - Student One
    RegisterUserResponse:
      type: object
      additionalProperties: false
      required:
        - userId
      properties:
        userId:
          type: string
          format: uuid
          description: Identifier of the newly created user.
          examples:
            - 9f1c7d3e-6b2a-4c88-9f0e-2a5b1c3d4e6f
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: >-
            Email address. Trimmed and lowercased before validation and
            verification.
          maxLength: 320
          examples:
            - Student@Example.com
        password:
          type: string
          description: >-
            Plaintext password. Verified against the stored protected hash and
            never echoed in any response.
          minLength: 8
          maxLength: 72
          format: password
          examples:
            - Learn123
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: >-
            Signed access token, valid for 15m. Carries the user id as the subject
            and the user role.
        refreshToken:
          type: string
          description: >-
            Rotating refresh token, valid for 7d, persisted with a unique jti.
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: The refresh token issued by sign-in or a previous refresh.
          minLength: 1
    RefreshResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: Signed access token, valid for 15m, carrying the user id and role.
        refreshToken:
          type: string
          description: Replacement refresh token, valid for 7d and persisted.
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: The refresh token naming the session to end.
          minLength: 1
    Profile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - role
        - createdAt
        - profile
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          examples:
            - STUDENT
        cefrLevel:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/ProfileFields'
    ProfileFields:
      type: object
      additionalProperties: false
      properties:
        nativeLanguage:
          type: [string, 'null']
        goals:
          type: [string, 'null']
        timezone:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: Present to change; blank is refused.
        nativeLanguage:
          type: [string, 'null']
          description: Absent keeps the value; null clears it.
        goals:
          type: [string, 'null']
          description: Absent keeps the value; null clears it.
        timezone:
          type: [string, 'null']
          description: Absent keeps the value; null clears it.
        avatarUrl:
          type: [string, 'null']
          description: Absent keeps the value; null clears it.
        currentPassword:
          type: string
          description: Required when newPassword is present.
        newPassword:
          type: string
          description: Must meet the password policy.
    UserPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        total:
          type: integer
          description: Number of accounts matching the filters.
        page:
          type: integer
        limit:
          type: integer
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
        cefrLevel:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - timestamp
        - path
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          examples:
            - validation_error
        message:
          type: string
          description: >-
            Human-readable message. For validation errors it names the specific
            violated rule. Never contains passwords or existing-account details.
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 UTC time at which the error was produced.
        path:
          type: string
          description: Request path that produced the error.
          examples:
            - /api/identity/auth/register
