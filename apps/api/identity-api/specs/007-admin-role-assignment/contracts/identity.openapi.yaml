openapi: 3.1.0
info:
  title: Identity Service API - Admin Role Assignment
  version: 1.0.0
  description: >-
    Contract for admin role assignment (CU-AUTH-07 / HU-17). Covers
    PATCH /api/identity/users/{id}/role, restricted to administrators.
servers:
  - url: /
tags:
  - name: Identity
paths:
  /api/identity/users/{id}/role:
    patch:
      tags:
        - Identity
      operationId: changeUserRole
      security:
        - bearerAuth: []
      summary: Set another account's role
      description: >-
        Sets the target account's role to one of the four defined roles and returns
        the updated account. An administrator cannot change their own role. The
        response never contains a password.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          description: The body is malformed or carries unknown fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The bearer credential is missing, malformed, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            The caller is not an administrator, or is targeting their own account.
            The code is FORBIDDEN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: FORBIDDEN
                message: forbidden
                timestamp: '2026-11-20T10:15:30.123Z'
                path: /api/identity/users/9f1c7d3e/role
        '404':
          description: No account has that id. The code is NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The role is not one of the four defined values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum: [STUDENT, TEACHER, ADMIN, REVIEWER]
    UserSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - displayName
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [STUDENT, TEACHER, ADMIN, REVIEWER]
        cefrLevel:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - timestamp
        - path
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
