worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen 8080;
        server_name _;

        root /data/data/com.termux/files/home/apps/lms-app/frontend;
        index index.html;

        # Traffic API -> gateway-auth (:8081)
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Healthcheck direct to gateway
        location = /health {
            proxy_pass http://127.0.0.1:8081/health;
            proxy_http_version 1.1;
        }

        # Cache aggressive for bundles with hash generates by Angular 22
        location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Fallback SPA (avoid 404 at reload /dashboard o /login)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}